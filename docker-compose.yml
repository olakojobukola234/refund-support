services:
  backend:
    build: ./backend
    environment:
      DJANGO_DEBUG: "false"
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      API_KEY: ${API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_REPLY_ENABLED: ${AI_REPLY_ENABLED:-false}
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000/api
    ports:
      - "3000:80"
    depends_on:
      - backend